name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/ansible-runner

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const releaseLabel = labels.find(l => l.startsWith('release:'));
            if (!releaseLabel) {
              core.setFailed('No release label found on merged PR');
              return;
            }
            const bump = releaseLabel.replace('release:', '');
            core.setOutput('type', bump);
            core.info(`Bump type: ${bump}`);

      - name: Get latest tag and compute next version
        id: version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          # Strip leading 'v'
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          BUMP="${{ steps.bump.outputs.type }}"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Previous: $LATEST → Next: $NEXT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FLAG=""
          if [ "${{ steps.version.outputs.latest }}" != "v0.0.0" ]; then
            NOTES_FLAG="--notes-start-tag ${{ steps.version.outputs.latest }}"
          fi
          gh release create "${{ steps.version.outputs.next }}" \
            --target main \
            --title "${{ steps.version.outputs.next }}" \
            --generate-notes \
            $NOTES_FLAG

  build-and-push:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Compute tags
        id: tags
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SEMVER="${VERSION#v}"
          MAJOR_MINOR="${SEMVER%.*}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS="${{ env.IMAGE }}:${SEMVER}"
          TAGS="${TAGS},${{ env.IMAGE }}:${MAJOR_MINOR}"
          TAGS="${TAGS},${{ env.IMAGE }}:sha-${SHORT_SHA}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
