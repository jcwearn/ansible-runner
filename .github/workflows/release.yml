name: Release

# Calls the shared release workflow in jcwearn/workflows.
#
# The hand-rolled version this replaces tagged first and built second, so a
# failed build left a git tag and a GitHub Release naming an image that was
# never pushed. v0.1.29 through v0.1.35 are exactly that: seven releases over
# a month, all red at the build step, unnoticed. The shared workflow orders
# publish after build, inside the reusable workflow, so a caller cannot
# rewire it back.
#
# move-major-tag is left off (the default). This repo's artifact is the
# container image and consumers pin image tags, so a moving git tag would be
# created and never read. The moving IMAGE tags are unaffected.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    # Both scopes are required, and packages: write is not optional just
    # because the build might be skipped: nested-job permissions are validated
    # statically, before any `if:` runs. Omitting it makes the workflow fail to
    # parse rather than fail at the push.
    permissions:
      contents: write # git tag + GitHub Release
      packages: write # push to GHCR
    uses: jcwearn/workflows/.github/workflows/release.yaml@6a75f6e6fde803f32b2ed2987e2142e77abdc4c0 # v1
    with:
      # Literal rather than ${{ github.repository_owner }} so the image name
      # stays greppable from k3s-cluster, which is the only reason anyone
      # opens this file.
      image: ghcr.io/jcwearn/ansible-runner
