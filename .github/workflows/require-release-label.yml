name: Require Release Label

# Calls the shared check in jcwearn/workflows, so the label vocabulary is
# defined in one place rather than drifting between repos. The version this
# replaces accepted any `release:*` suffix and fed it to a case statement with
# no default arm, so a typo became "bump nothing" and then died on a duplicate
# tag -- reading as a flaky release rather than a mislabelled PR.
#
# release:skip is part of that vocabulary now, so a docs-only or CI-only PR has
# a way out that is not "forget the label and go red after the merge."
#
# Two trigger details that are load-bearing:
#
#   branches: [main] -- the previous version had no branch filter and ran on
#     PRs targeting any branch.
#
#   edited -- fires when a PR's base branch changes. Without it a stacked PR
#     retargeted onto main after its parent merges never runs this check at
#     all, because every earlier event was filtered out while the base was
#     still the parent branch.

on:
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, synchronize]
    branches: [main]

jobs:
  check:
    uses: jcwearn/workflows/.github/workflows/require-release-label.yaml@v1
